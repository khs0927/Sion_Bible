name: Production AI smoke test

on:
  push:
    branches:
      - ops/production-ai-smoke-20260720
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test production APIs
        env:
          SION_BIBLE_BASE_URL: https://sion-bible.vercel.app
        run: npm run test:api
