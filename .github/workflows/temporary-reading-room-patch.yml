name: Temporary reading room source patch

on:
  push:
    branches:
      - feature/reading-room-reference-ui

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: resolve existing typecheck blockers') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/reading-room-reference-ui

      - name: Patch source files
        run: |
          python - <<'PY'
          from pathlib import Path

          picker = Path('src/components/bible/BibleVersePicker.tsx')
          text = picker.read_text(encoding='utf-8')
          text = text.replace("import { Loader2 } from 'lucide-react';", "import { Check, Loader2 } from 'lucide-react';")
          picker.write_text(text, encoding='utf-8')

          search = Path('src/components/bible/BibleSearchSheet.tsx')
          text = search.read_text(encoding='utf-8')
          text = text.replace(
              "setSearchMeta(questionMode && 'meta' in response ? response.meta : null);",
              "setSearchMeta(questionMode && 'meta' in response ? response.meta as AiBibleSearchMeta : null);",
          )
          search.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bible/BibleVersePicker.tsx src/components/bible/BibleSearchSheet.tsx
          git commit -m "fix: resolve existing typecheck blockers"
          git push origin HEAD:feature/reading-room-reference-ui
