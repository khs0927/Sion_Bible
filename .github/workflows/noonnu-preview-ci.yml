name: Noonnu reading memory validation

on:
  push:
    branches:
      - feat/noonnu-reading-memory-polish
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Bible index
        run: npm run audit:bible

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
